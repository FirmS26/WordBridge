<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WordBridge - Learn English</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=rel" rel="stylesheet">
    
    
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }
        
        .welcome-text {
            font-size: 2.5rem;
            font-weight: 700;
            color: white;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
        }
        
        .play-btn {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: white;
            border: none;
            font-size: 3rem;
            color: #667eea;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto;
            transition: all 0.3s ease;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }
        
        .play-btn:hover {
            transform: scale(1.1);
            box-shadow: 0 15px 40px rgba(0,0,0,0.4);
            color: #764ba2;
        }
        
        .subtitle {
            color: rgba(255,255,255,0.9);
            font-size: 1.1rem;
            margin-top: 1rem;
        }
    </style>
</head>
<body>
    <div class="container d-flex align-items-center justify-content-center min-vh-100">
        <div class="row">
            <div class="col-12 text-center">
                
                <h1 class="welcome-text mb-3">Welcome to WordBridge</h1>
                <p class="subtitle mb-5">Learn English for your career, life, and goals</p>
                
                
                <button class="play-btn" onclick="window.location.href='career.html'">
                    ▶
                </button>
                
                <p class="subtitle mt-5">Click the button to start your journey</p>
                
            </div>
            <div class="text-center mt-4">
                <a href="signup.html" class="btn btn-primary btn-lg">
                    <i class="fas fa-user-plus"></i> Sign Up
                </a>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <script>
        function startLearning() {
            window.location.href = 'career.html';
        }
    </script>
</body>
</html>
