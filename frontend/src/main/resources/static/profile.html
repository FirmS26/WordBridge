<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WordBridge - Profile</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <nav class="navbar navbar-light bg-white border-bottom">
        <div class="container">
            <a href="index.html" class="text-decoration-none">← Back</a>
            <span class="fw-bold">My Profile</span>
            <a href="module1.html" class="text-decoration-none">📘 Learn</a>
        </div>
    </nav>

    <div class="container" style="max-width: 500px; margin-top: 2rem;">
        <div class="card shadow-sm mb-4">
            <div class="card-body text-center">
                <div class="bg-primary text-white rounded-circle mx-auto mb-3" style="width: 80px; height: 80px; line-height: 80px; font-size: 2rem;">
                    JD
                </div>
                <h4>John Doe</h4>
                <p class="text-muted">john@email.com</p>
                <span class="badge bg-success">Beginner</span>
            </div>
        </div>

        <div class="row g-3 mb-4">
            <div class="col-4">
                <div class="card text-center p-2">
                    <h5>3</h5>
                    <small class="text-muted">Lessons</small>
                </div>
            </div>
            <div class="col-4">
                <div class="card text-center p-2">
                    <h5>85%</h5>
                    <small class="text-muted">Avg Score</small>
                </div>
            </div>
            <div class="col-4">
                <div class="card text-center p-2">
                    <h5>2</h5>
                    <small class="text-muted">Day Streak</small>
                </div>
            </div>
        </div>

        <div class="card shadow-sm mb-4">
            <div class="card-body">
                <h6>Your Progress</h6>
                <div class="mb-3">
                    <div class="d-flex justify-content-between">
                        <span>Email Writing</span>
                        <span>3/5</span>
                    </div>
                    <div class="progress" style="height: 5px;">
                        <div class="progress-bar bg-success" style="width: 60%"></div>
                    </div>
                </div>
                
                <div class="mb-3">
                    <div class="d-flex justify-content-between">
                        <span>Meeting Skills</span>
                        <span class="text-muted">Locked</span>
                    </div>
                    <div class="progress" style="height: 5px;">
                        <div class="progress-bar bg-secondary" style="width: 0%"></div>
                    </div>
                </div>
            </div>
        </div>

        <div class="card shadow-sm">
            <div class="card-body">
                <h6>Words to Review</h6>
                <ul class="list-group list-group-flush">
                    <li class="list-group-item d-flex justify-content-between">
                        <span>subject line</span>
                        <span class="badge bg-warning">Review</span>
                    </li>
                    <li class="list-group-item d-flex justify-content-between">
                        <span>deadline</span>
                        <span class="badge bg-warning">Review</span>
                    </li>
                    <li class="list-group-item d-flex justify-content-between">
                        <span>attachment</span>
                        <span class="badge bg-success">Learned</span>
                    </li>
                </ul>
                <a href="module1.html" class="btn btn-outline-primary w-100 mt-3">Continue Learning</a>
            </div>
        </div>
        
        <div class="text-center mt-4">
            <a href="index.html" class="btn btn-link text-danger">Log Out</a>
        </div>
    </div>
</body>
</html>
