<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WordBridge - Sign Up</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container" style="max-width: 400px; margin-top: 5rem;">
        <div class="text-center mb-4">
            <h2>Create Account</h2>
            <p class="text-muted">Start learning today</p>
        </div>
        
        <div class="card p-4 shadow-sm">
            <form action="#" th:action="@{/signup}" th:object="${user}" method="POST">
                <div class="mb-3">
                    <label class="form-label">Name</label>
                    <input type="text" class="form-control" placeholder="Your name" th:field="*{name}">
                </div>
                
                <div class="mb-3">
                    <label class="form-label">Email</label>
                    <input type="email" class="form-control" placeholder="you@example.com" th:field="*{email}">
                </div>
                
                <div class="mb-3">
                    <label class="form-label">Password</label>
                    <input type="password" class="form-control" placeholder="••••••••" th:field="*{password}">
                </div>
                
                <button type="submit" value="Submit" class="btn btn-primary w-100 mb-3" onclick="window.location.href='career.html'">Sign Up</button>
                
                <div class="text-center">
                    <a href="login.html" class="text-decoration-none">Already have an account?</a>
                </div>
            </form>
        </div>
        
        <div class="text-center mt-3">
            <a href="index.html" class="text-decoration-none">← Back to Home</a>
        </div>
    </div>
</body>
</html>
