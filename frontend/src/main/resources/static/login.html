<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log In - WordBridge</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            margin: 0;
            min-height: 100vh;
            background: linear-gradient(145deg, #1B4A5E 0%, #2E7A6E 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .container {
            max-width: 400px;
            width: 100%;
        }
        
        .logo {
            text-align: center;
            margin-bottom: 2rem;
        }
        
        .logo h1 {
            font-size: 2.5rem;
            font-weight: 700;
            color: white;
            margin-bottom: 0.5rem;
            text-shadow: 0 4px 6px rgba(0,0,0,0.2);
            letter-spacing: -0.5px;
        }
        
        .logo p {
            color: rgba(255,255,255,0.9);
            font-size: 1rem;
            margin: 0;
        }
        
        .login-card {
            background: white;
            border-radius: 20px;
            padding: 2rem;
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
        }
        
        .login-card h2 {
            color: #1B4A5E;
            font-size: 1.5rem;
            font-weight: 600;
            margin-bottom: 0.25rem;
        }
        
        .login-card .subtitle {
            color: #5A6B7A;
            font-size: 0.9rem;
            margin-bottom: 1.5rem;
        }
        
        .form-label {
            color: #2C3E50;
            font-weight: 600;
            font-size: 0.9rem;
            margin-bottom: 0.5rem;
            display: block;
        }
        
        .form-control {
            width: 100%;
            padding: 0.8rem 1rem;
            border: 2px solid #E0E0E0;
            border-radius: 12px;
            font-family: 'Inter', sans-serif;
            font-size: 0.95rem;
            transition: all 0.3s;
            box-sizing: border-box;
        }
        
        .form-control:focus {
            outline: none;
            border-color: #2E7A6E;
            box-shadow: 0 0 0 3px rgba(46, 122, 110, 0.1);
        }
        
        .form-text {
            color: #95A5A6;
            font-size: 0.8rem;
            margin-top: 0.3rem;
        }
        
        .btn-primary {
            width: 100%;
            padding: 1rem;
            background: #FFB74D;
            color: #1B4A5E;
            border: none;
            border-radius: 12px;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s;
            margin: 1rem 0;
        }
        
        .btn-primary:hover {
            background: #FFA726;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(255, 183, 77, 0.3);
        }
        
        .signup-link {
            text-align: center;
            margin-top: 1rem;
        }
        
        .signup-link a {
            color: #5A6B7A;
            text-decoration: none;
            font-size: 0.9rem;
            transition: color 0.3s;
        }
        
        .signup-link a:hover {
            color: #1B4A5E;
            text-decoration: underline;
        }
        
        .back-home {
            text-align: center;
            margin-top: 1.5rem;
        }
        
        .back-home a {
            color: rgba(255,255,255,0.8);
            text-decoration: none;
            font-size: 0.9rem;
            transition: all 0.3s;
        }
        
        .back-home a:hover {
            color: white;
            text-decoration: underline;
        }
        
        .mb-3 {
            margin-bottom: 1rem;
        }
        
        .mb-4 {
            margin-bottom: 1.5rem;
        }
        
        .forgot-password {
            text-align: right;
            margin-top: -0.5rem;
            margin-bottom: 1rem;
        }
        
        .forgot-password a {
            font-size: 0.8rem;
            color: #95A5A6;
            text-decoration: none;
        }
        
        .forgot-password a:hover {
            color: #1B4A5E;
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Logo/Brand -->
        <div class="logo">
            <h1>📚 WordBridge</h1>
            <p>Welcome back to your learning journey</p>
        </div>
        
        <!-- Log In Card -->
        <div class="login-card">
            <h2>Welcome Back</h2>
            <p class="subtitle">Sign in to continue your practice</p>
            
            <form id="loginForm">
                <!-- Email Field -->
                <div class="mb-3">
                    <label class="form-label">Email Address</label>
                    <input type="email" class="form-control" placeholder="you@example.com" required>
                </div>
                
                <!-- Password Field -->
                <div class="mb-3">
                    <label class="form-label">Password</label>
                    <input type="password" class="form-control" placeholder="••••••••" required>
                </div>
                
                <!-- Forgot Password Link -->
                <div class="forgot-password">
                    <a href="#" onclick="alert('Password reset feature coming soon!'); return false;">Forgot password?</a>
                </div>
                
                <!-- Submit Button -->
                <button type="submit" class="btn-primary">
                    Log In
                </button>
                
                <!-- Sign Up Link -->
                <div class="signup-link">
                    <a href="signup.html">
                        Need an account? Sign up
                    </a>
                </div>
            </form>
        </div>
        
        <!-- Back to Home -->
        <div class="back-home">
            <a href="index.html">
                ← Back to Home
            </a>
        </div>
    </div>

    <!-- Form handling script -->
    <script>
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            // Get form values
            const email = document.querySelector('input[type="email"]').value;
            const password = document.querySelector('input[type="password"]').value;
            
            // Basic validation
            if (email && password) {
                // Demo login - just show success message and redirect
                alert('Welcome back! (Demo login)');
                window.location.href = 'words.html';
            } else {
                alert('Please enter both email and password.');
            }
        });
    </script>
</body>
</html>
