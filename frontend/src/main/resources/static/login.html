<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WordBridge - Log In</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container" style="max-width: 400px; margin-top: 5rem;">
        <div class="text-center mb-4">
            <h2>Enter email and password</h2>
            <p class="text-muted">Keep learning today</p>
        </div>
        
        <div class="card p-4 shadow-sm">
            <form>
                
                <div class="mb-3">
                    <label class="form-label">Email</label>
                    <input type="email" class="form-control" placeholder="you@example.com">
                </div>
                
                <div class="mb-3">
                    <label class="form-label">Password</label>
                    <input type="password" class="form-control" placeholder="••••••••">
                </div>
                
                <button type="submit" class="btn btn-primary w-100 mb-3" onclick="window.location.href='career.html'">Log In</button>
                
                <div class="text-center">
                    <a href="signup.html" class="text-decoration-none">Need an account?</a>
                </div>
            </form>
        </div>
        
        <div class="text-center mt-3">
            <a href="index.html" class="text-decoration-none">← Back to Home</a>
        </div>
    </div>
</body>
</html>
