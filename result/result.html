<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Results - WordBridge</title>
  <link rel="stylesheet" href="result.css" />
  <script src="result.js" defer></script>
</head>
<body>
  <div class="page-container">
    <div class="top-bar">
      <div class="logo">WordBridge</div>
      <a class="back-link" href="words.html">← Back to word list</a>
    </div>

    <div class="main-card">
      <h1 class="page-title">
        Results for <span class="word-highlight" id="word"></span>
      </h1>
      <p class="subtitle">
        Review your sentence, feedback, and example usage below.
      </p>

      <div id="result-status" class="result-status warning">
        <span class="status-icon">⏳</span>
        <span id="status-text">Analyzing your sentence...</span>
      </div>

      <div class="sentence-card">
        <p class="sentence-label">Your sentence</p>
        <p class="user-sentence" id="sentence-display"></p>
      </div>

      <div class="content-grid">
        <div class="section">
          <h2>📚 Word Forms (Lemmas)</h2>
          <div id="lemmas" class="chip-list"></div>
        </div>

        <div class="section">
          <h2>🔗 Common Collocations</h2>
          <div id="collocations" class="chip-list"></div>
        </div>
      </div>

      <div class="section guidance-section">
        <h2>💡 Feedback &amp; Guidance</h2>
        <p id="guidance" class="loading">Analyzing your sentence...</p>
      </div>

      <div class="section example-section">
        <h2>✅ Example Sentence</h2>
        <p id="correct-answer"></p>
      </div>

      <div class="button-group">
        <button onclick="tryAgain()">Try Again</button>
        <button class="secondary" onclick="window.location.href='words.html'">
          Choose Another Word
        </button>
      </div>
    </div>
  </div>
</body>
</html>
