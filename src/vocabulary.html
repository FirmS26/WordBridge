<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Vocabulary Builder</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

body{
background:#f5f7fb;
font-family:Arial, sans-serif;
}

.card{
max-width:500px;
margin:auto;
margin-top:120px;
text-align:center;
}

.word{
font-size:2rem;
font-weight:bold;
}

.meaning{
color:gray;
font-size:1.1rem;
}

</style>

</head>

<body>

<div class="container">

<div class="card shadow p-4">

<h3 class="mb-4">Vocabulary Builder</h3>

<div class="word" id="word">Loading...</div>
<p class="meaning" id="meaning"></p>

<button class="btn btn-primary mt-3" onclick="nextWord()">
Next Word
</button>

</div>

</div>

<script>

let words = [];

fetch("dictionary.json")
.then(response => response.json())
.then(data => {
    words = data;
    nextWord();
})
.catch(error => {
    console.error("Dictionary load error:", error);
});

function nextWord(){

if(words.length === 0){
return;
}

let random = Math.floor(Math.random() * words.length);

document.getElementById("word").innerText = words[random].word;
document.getElementById("meaning").innerText = words[random].meaning;

}

</script>

</body>
</html>
