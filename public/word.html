<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Write a Sentence - WordBridge</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            margin: 0;
            min-height: 100vh;
            background: linear-gradient(145deg, #1B4A5E 0%, #2E7A6E 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .notebook {
            background: white;
            width: 100%;
            max-width: 700px;
            margin: 0 auto;
            padding: 40px 50px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            border-radius: 20px;
            position: relative;
            background-image: 
                linear-gradient(#e0e0e0 1px, transparent 1px),
                linear-gradient(90deg, #f8f9fa 10px, transparent 10px);
            background-size: 100% 30px, 30px 100%;
        }
        
        /* Spiral binding effect */
        .notebook::before {
            content: '';
            position: absolute;
            left: -15px;
            top: 50px;
            bottom: 50px;
            width: 30px;
            background: repeating-linear-gradient(
                90deg,
                #666,
                #666 5px,
                #999 5px,
                #999 10px
            );
            border-radius: 15px;
            box-shadow: 2px 2px 5px rgba(0,0,0,0.3);
        }
        
        h1 {
            font-size: 2rem;
            color: #1B4A5E;
            font-weight: 600;
            margin-top: 0;
            margin-bottom: 30px;
            padding-left: 30px;
        }
        
        .word-badge {
            background: #FFB74D;
            color: #1B4A5E;
            padding: 8px 20px;
            border-radius: 40px;
            display: inline-block;
            font-size: 1.5rem;
            font-weight: 700;
            margin: 20px 0 20px 30px;
            box-shadow: 0 4px 8px rgba(255, 183, 77, 0.3);
        }
        
        .prompt {
            font-size: 1.1rem;
            color: #2C3E50;
            margin: 30px 0 20px 30px;
            border-left: 4px solid #FFB74D;
            padding-left: 20px;
        }
        
        textarea {
            width: 90%;
            margin: 20px 0 20px 30px;
            padding: 20px;
            font-size: 1.1rem;
            font-family: 'Inter', sans-serif;
            border: 2px solid #E0E0E0;
            background: #F8F9FA;
            border-radius: 12px;
            line-height: 1.6;
            resize: vertical;
            min-height: 150px;
            transition: all 0.3s;
            box-sizing: border-box;
        }
        
        textarea:focus {
            outline: none;
            border-color: #2E7A6E;
            background: white;
            box-shadow: 0 0 0 3px rgba(46, 122, 110, 0.1);
        }
        
        textarea::placeholder {
            color: #95A5A6;
            font-style: italic;
        }
        
        .button-container {
            margin-left: 30px;
        }
        
        button {
            padding: 15px 40px;
            font-size: 1.1rem;
            font-weight: 600;
            background: #FFB74D;
            color: #1B4A5E;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 4px 8px rgba(255, 183, 77, 0.3);
        }
        
        button:hover {
            background: #FFA726;
            transform: translateY(-2px);
            box-shadow: 0 8px 16px rgba(255, 183, 77, 0.4);
        }
        
        .back-link {
            margin-top: 30px;
            margin-left: 30px;
            display: inline-block;
            color: #5A6B7A;
            text-decoration: none;
            font-size: 0.95rem;
            transition: color 0.3s;
        }
        
        .back-link:hover {
            color: #1B4A5E;
            text-decoration: underline;
        }
        
        .back-link::before {
            content: '←';
            margin-right: 5px;
        }
    </style>
</head>
<body>

    <div style="width: 100%; max-width: 700px; margin: 0 auto;">
    
    <!-- NAVIGATION BAR -->
    <div class="nav-bar">
        <a href="index.html" class="nav-logo">📖 WordBridge</a>
        <div class="nav-links">
            <a href="words.html">Words</a>
            <a href="review.html">Review N/A</a>
            <a href="progress.html">Progress</a>
            <a href="profile.html" class="profile-badge">👤 Profile</a>
        </div>
    </div>
        
    <div class="notebook">
        <h1>📝 Write & Learn</h1>
        
        <div class="word-badge" id="word"></div>
        
        <div class="prompt">
            Write a sentence using this academic word:
        </div>
        
        <form id="sentence-form">
            <textarea 
                id="sentence" 
                placeholder="e.g., The researcher will analyse the data carefully..."
                required
            ></textarea>
            
            <div class="button-container">
                <button type="submit">
                    Submit Sentence
                </button>
            </div>
        </form>
        
        <a href="words.html" class="back-link">Back to word list</a>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const word = urlParams.get('word');
        
        if (!word) {
            window.location.href = 'words.html';
        } else {
            document.getElementById('word').textContent = word;
        }

        document.getElementById('sentence-form').addEventListener('submit', (e) => {
            e.preventDefault();
            const sentence = document.getElementById('sentence').value.trim();
            
            if (sentence) {
                window.location.href = `result.html?word=${encodeURIComponent(word)}&sentence=${encodeURIComponent(sentence)}`;
            }
        });
    </script>
</body>
</html>
