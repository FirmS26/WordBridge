<!DOCTYPE html>
<html>
<head>
    <title>Write a sentence</title>
    <style>
        body { font-family: Arial; max-width: 600px; margin: auto; padding: 2rem; }
        textarea { width: 100%; height: 100px; margin: 1rem 0; }
        button { padding: 0.5rem 1rem; }
    </style>
</head>
<body>
    <h1>Write a sentence with: <span id="word"></span></h1>
    <form id="sentence-form">
        <textarea id="sentence" placeholder="Enter your sentence here..." required></textarea>
        <br>
        <button type="submit">Submit</button>
    </form>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const word = urlParams.get('word');
        document.getElementById('word').textContent = word;

        document.getElementById('sentence-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const sentence = document.getElementById('sentence').value;

            window.location.href = `result.html?word=${encodeURIComponent(word)}&sentence=${encodeURIComponent(sentence)}`;
        });
    </script>
</body>
</html>
