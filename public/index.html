<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WordBridge - Learn English</title>
    
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Google Fonts - Poppins -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    
    <!-- Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }
        
        .welcome-text {
            font-size: 2.5rem;
            font-weight: 700;
            color: white;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
            animation: fadeInDown 1s ease;
        }
        
        .play-btn {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: white;
            border: none;
            font-size: 3rem;
            color: #667eea;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto;
            transition: all 0.3s ease;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            cursor: pointer;
            animation: pulse 2s infinite;
        }
        
        .play-btn:hover {
            transform: scale(1.1);
            box-shadow: 0 15px 40px rgba(0,0,0,0.4);
            color: #764ba2;
            animation: none;
        }
        
        .subtitle {
            color: rgba(255,255,255,0.9);
            font-size: 1.1rem;
            margin-top: 1rem;
            animation: fadeInUp 1s ease;
        }
        
        .btn-primary {
            background: white;
            color: #667eea;
            border: none;
            padding: 0.8rem 2rem;
            font-weight: 600;
            transition: all 0.3s;
            animation: fadeIn 1.5s ease;
        }
        
        .btn-primary:hover {
            background: #f8f9fa;
            color: #764ba2;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }
        
        /* Animations */
        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body>
    <div class="container d-flex align-items-center justify-content-center min-vh-100">
        <div class="row">
            <div class="col-12 text-center">
                
                <!-- Welcome Message -->
                <h1 class="welcome-text mb-3">Welcome to WordBridge</h1>
                <p class="subtitle mb-5">Learn English for your career, life, and goals</p>
                
                <!-- Play Button - Links to Word List -->
                <a href="words.html" class="play-btn text-decoration-none">
                    ▶
                </a>
                
                <p class="subtitle mt-5">Click the button to start your journey</p>
                
                <!-- Sign Up Button -->
                <div class="mt-4">
                    <a href="signup.html" class="btn btn-primary btn-lg">
                        <i class="fas fa-user-plus me-2"></i>Sign Up
                    </a>
                </div>
                
                <!-- Optional: Login link for existing users -->
                <div class="mt-3">
                    <a href="login.html" class="text-white-50 text-decoration-none small">
                        Already have an account? Sign in
                    </a>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
