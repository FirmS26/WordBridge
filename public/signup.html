<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - WordBridge</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }
        .card {
            border: none;
            border-radius: 15px;
        }
        .btn-primary {
            background: #667eea;
            border: none;
            padding: 0.8rem;
            font-weight: 600;
            transition: all 0.3s;
        }
        .btn-primary:hover {
            background: #764ba2;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }
        .form-control:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 0.2rem rgba(102, 126, 234, 0.25);
        }
    </style>
</head>
<body>
    <div class="container" style="max-width: 400px; margin-top: 5rem;">
        <!-- Logo/Brand -->
        <div class="text-center mb-4">
            <h1 class="text-white fw-bold">WordBridge</h1>
            <p class="text-white-50">Join our learning community</p>
        </div>
        
        <!-- Sign Up Card -->
        <div class="card p-4 shadow-lg">
            <div class="text-center mb-4">
                <h2 class="h4 mb-1">Create Account</h2>
                <p class="text-muted small">Start your journey today</p>
            </div>
            
            <form id="signupForm">
                <!-- Name Field -->
                <div class="mb-3">
                    <label class="form-label fw-semibold">Full Name</label>
                    <input type="text" class="form-control" placeholder="John Doe" required>
                </div>
                
                <!-- Email Field -->
                <div class="mb-3">
                    <label class="form-label fw-semibold">Email Address</label>
                    <input type="email" class="form-control" placeholder="you@example.com" required>
                    <div class="form-text">We'll never share your email.</div>
                </div>
                
                <!-- Password Field -->
                <div class="mb-4">
                    <label class="form-label fw-semibold">Password</label>
                    <input type="password" class="form-control" placeholder="••••••••" required minlength="6">
                    <div class="form-text">At least 6 characters</div>
                </div>
                
                <!-- Submit Button -->
                <button type="submit" class="btn btn-primary w-100 mb-3">
                    Create Account
                </button>
                
                <!-- Login Link -->
                <div class="text-center">
                    <a href="login.html" class="text-decoration-none small">
                        Already have an account? Sign in
                    </a>
                </div>
            </form>
        </div>
        
        <!-- Back to Home -->
        <div class="text-center mt-3">
            <a href="index.html" class="text-white-50 text-decoration-none small">
                ← Back to Home
            </a>
        </div>
    </div>

    <!-- Bootstrap JS (optional, for future interactivity) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- Form handling script -->
    <script>
        document.getElementById('signupForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            // Get form values
            const name = document.querySelector('input[type="text"]').value;
            const email = document.querySelector('input[type="email"]').value;
            const password = document.querySelector('input[type="password"]').value;
            
            // Basic validation
            if (name && email && password.length >= 6) {
                // For now, just show success message and redirect
                alert('Account created! (Demo version)');
                window.location.href = 'words.html'; // Go to word list
            } else {
                alert('Please fill all fields correctly. Password must be at least 6 characters.');
            }
        });
    </script>
</body>
</html>
