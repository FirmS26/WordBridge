<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WordBridge - Learn English</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            margin: 0;
            min-height: 100vh;
            background: linear-gradient(145deg, #1B4A5E 0%, #2E7A6E 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .container {
            max-width: 800px;
            width: 100%;
            text-align: center;
        }
        
        .logo {
            font-size: 3.5rem;
            font-weight: 700;
            color: white;
            margin-bottom: 1rem;
            text-shadow: 0 4px 6px rgba(0,0,0,0.2);
            letter-spacing: -0.5px;
        }
        
        .tagline {
            font-size: 1.3rem;
            color: rgba(255,255,255,0.9);
            margin-bottom: 3rem;
            font-weight: 400;
            max-width: 600px;
            margin-left: auto;
            margin-right: auto;
        }
        
        .play-button {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: #FFB74D;
            border: none;
            font-size: 2rem;
            color: #1B4A5E;
            cursor: pointer;
            transition: all 0.3s;
            margin: 30px auto;
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .play-button:hover {
            transform: scale(1.1) rotate(90deg);
            background: #FFA726;
            box-shadow: 0 15px 30px rgba(0,0,0,0.4);
        }
        
        .cta-button {
            background: #FFB74D;
            color: #1B4A5E;
            border: none;
            padding: 15px 40px;
            font-size: 1.2rem;
            font-weight: 600;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 20px;
        }
        
        .cta-button:hover {
            background: #FFA726;
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
        }
        
        .footer-links {
            margin-top: 40px;
            color: rgba(255,255,255,0.8);
        }
        
        .footer-links a {
            color: white;
            text-decoration: none;
            margin: 0 15px;
            opacity: 0.9;
            font-size: 0.95rem;
        }
        
        .footer-links a:hover {
            opacity: 1;
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">WordBridge</div>
        <div class="tagline">Master academic English through focused practice</div>
        
        <button class="play-button" onclick="window.location.href='words.html'">▶</button>
        
        <button class="cta-button" onclick="window.location.href='words.html'">
            Start Learning Now →
        </button>


        <div class="footer-links">
            <a href="tutorial.html">Tutorial</a>
            <a href="review.html">Review</a>
            
        </div>
        

    </div>
</body>
</html>
