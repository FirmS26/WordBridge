<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WordBridge - Choose Path</title>
    
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            font-family: Arial, sans-serif;
        }
        
        h1 { color: white; font-weight: bold; }
        .subtitle { color: rgba(255,255,255,0.8); }
        
        .card {
            background: white;
            border-radius: 15px;
            padding: 2rem;
            text-align: center;
            height: 100%;
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
        }
        
        .business-card { border: 3px solid gold; }
        
        .icon { font-size: 3rem; color: #667eea; margin-bottom: 1rem; }
        
        .badge {
            display: inline-block;
            padding: 0.3rem 1rem;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: normal;
        }
        
        .badge-available { background: gold; color: #333; }
        .badge-soon { background: #e0e0e0; color: #999; }
        
        .btn {
            background: white;
            color: #667eea;
            border: none;
            padding: 1rem 3rem;
            border-radius: 50px;
            font-weight: bold;
            font-size: 1.2rem;
            text-decoration: none;
            display: inline-block;
            margin-top: 2rem;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }
        
        .btn:hover { background: #f8f9fa; }
        
        .back {
            color: white;
            text-decoration: none;
            display: inline-block;
            margin: 1rem;
        }
    </style>
</head>
<body>

    <a href="index.html" class="back">
        <i class="fas fa-arrow-left"></i> Back
    </a>

    <div class="container" style="margin-top: 2rem;">
        <div class="text-center mb-5">
            <h1>Choose Your Path</h1>
            <p class="subtitle">Select an industry to begin</p>
        </div>

        <div class="row">
            <div class="col-md-6 mb-4">
                <div class="card business-card">
                    <div class="icon">
                        <i class="fas fa-briefcase"></i>
                    </div>
                    <h3>Business</h3>
                    <p class="text-muted">Emails, meetings, presentations</p>
                    <span class="badge badge-available">Available Now</span>
                </div>
            </div>

            <div class="col-md-6 mb-4">
                <div class="card">
                    <div class="icon">
                        <i class="fas fa-heartbeat"></i>
                    </div>
                    <h3>Healthcare</h3>
                    <p class="text-muted">Medical terms, patient care</p>
                    <span class="badge badge-soon">Coming Soon</span>
                </div>
            </div>
        </div>

        <div class="text-center">
            <a href="module1.html" class="btn">
                <i class="fas fa-play-circle"></i> Start Business English
            </a>
            <p class="subtitle mt-3 small">Healthcare coming soon!</p>
        </div>
    </div>

    <script>
        document.querySelector('.btn').onclick = function(e) {
            localStorage.setItem('selectedPath', 'business');
        };
    </script>

</body>
</html>
